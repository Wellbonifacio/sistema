<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta Comercial - BRvolts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-100 text-zinc-900 font-sans p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-blue-600 p-6 text-center">
            <img src="https://www.brvolts.site/logo1.png" alt="BRvolts" class="h-12 mx-auto mb-2 filter brightness-0 invert">
            <h1 class="text-white text-2xl font-bold">Proposta de Serviço</h1>
        </div>

        <div id="loading" class="p-8 text-center text-gray-500">Buscando detalhes do serviço...</div>
        
        <div id="conteudo-proposta" class="p-6 hidden">
            <div class="flex justify-between border-b pb-4 mb-4">
                <div>
                    <p class="text-sm text-gray-500">Cliente</p>
                    <p class="font-bold text-lg" id="prop-cliente">...</p>
                </div>
                <div class="text-right">
                    <p class="text-sm text-gray-500">OS Nº</p>
                    <p class="font-bold text-lg text-blue-600" id="prop-os">...</p>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Descrição do Serviço</h3>
                <p class="text-gray-700 whitespace-pre-wrap" id="prop-desc"></p>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg flex justify-between items-center mb-6 border">
                <span class="font-bold text-gray-600">Investimento Total:</span>
                <span class="text-2xl font-bold text-green-600" id="prop-valor">R$ 0,00</span>
            </div>

            <a id="btn-whatsapp" href="#" target="_blank" class="block w-full bg-green-500 hover:bg-green-600 text-white text-center font-bold py-4 rounded-lg transition shadow-lg">
                Falar com o Técnico no WhatsApp
            </a>
        </div>
    </div>

    <script>
        // 1. Conectar ao seu Supabase (Use suas mesmas chaves do painel admin)
        const supabaseUrl = 'https://mflvwscgghdvtxasgmdd.supabase.co';
        const supabaseKey = 'SUA_CHAVE_ANON_AQUI_IGUAL_DO_PAINEL';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Pegar o ID na URL
        const urlParams = new URLSearchParams(window.location.search);
        const idOS = urlParams.get('id');

        async function carregarProposta() {
            if(!idOS) {
                document.getElementById('loading').innerText = 'Link inválido. Nenhuma OS encontrada.';
                return;
            }

            // 3. Buscar os dados no Supabase
            const { data, error } = await supabase.from('servicos').select('*, clientes(nome)').eq('id', idOS).single();
            
            if (error || !data) {
                document.getElementById('loading').innerText = 'Proposta não encontrada ou indisponível.';
                return;
            }

            // 4. Preencher os dados na tela
            document.getElementById('loading').style.display = 'none';
            document.getElementById('conteudo-proposta').classList.remove('hidden');

            document.getElementById('prop-cliente').innerText = data.clientes?.nome || 'Cliente';
            document.getElementById('prop-os').innerText = data.os_number;
            document.getElementById('prop-desc').innerText = data.descricao;
            document.getElementById('prop-valor').innerText = parseFloat(data.valor_servico).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            
            // Botão do Zap
            const msg = encodeURIComponent(`Olá Wellington, estou com a proposta da OS ${data.os_number} aberta aqui e gostaria de...`);
            document.getElementById('btn-whatsapp').href = `https://api.whatsapp.com/send?phone=5521976493932&text=${msg}`;
        }

        carregarProposta();
    </script>
</body>
</html>
